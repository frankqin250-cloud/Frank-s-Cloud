name: BTC ETF and COT Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '30 22,23 * * 1-5'
    - cron: '0,30 0-4 * * 2-6'
    - cron: '*/15 19-21 * * 5'

permissions:
  contents: write

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 cloudscraper

      - name: Run monitor script
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python etf_cot_monitor.py --force
          else
            python etf_cot_monitor.py
          fi

      - name: Save deduplication state
        run: |
          git config --local user.email "bot@github.com"
          git config --local user.name "Monitor Bot"
          git add monitor_state.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update monitor state" && git push)
