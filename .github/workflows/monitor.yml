name: BTC ETF and COT Monitor

on:
  workflow_dispatch:
  schedule:
    # 1. 美盘盘中雷达：北京时间 21:00 至次日 04:50（UTC 13:00-20:50）每 10 分钟扫描 Coinbase 溢价
    - cron: '*/10 13-20 * * 1-5'
    # 2. CME 基差雷达：全天候每 30 分钟（XX:15 和 XX:45 错峰）扫描 CME 期货是否结束贴水（由负转正）
    - cron: '15,45 * * * *'
    # 3. 现货 ETF 盘后战报：北京时间 06:05 至 12:35（UTC 22:05-04:35）每 30 分钟检测
    - cron: '5,35 22-23 * * 1-5'
    - cron: '5,35 0-4 * * 2-6'
    # 4. CFTC 机构持仓周报：北京时间周六 03:02 至 05:47（UTC 周五 19:02-21:47）每 15 分钟检测
    - cron: '2,17,32,47 19-21 * * 5'

permissions:
  contents: write

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 cloudscraper

      - name: Run monitor script
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python etf_cot_monitor.py --force
          elif [ "${{ github.event.schedule }}" = "*/10 13-20 * * 1-5" ]; then
            python etf_cot_monitor.py --intraday
          elif [ "${{ github.event.schedule }}" = "15,45 * * * *" ]; then
            python etf_cot_monitor.py --basis
          else
            python etf_cot_monitor.py
          fi

      - name: Save deduplication state
        run: |
          git config --local user.email "bot@github.com"
          git config --local user.name "Monitor Bot"
          git add monitor_state.json || true
          if ! git diff --staged --quiet; then
            git commit -m "Update monitor state"
            git pull --rebase || true
            git push || true
          fi
