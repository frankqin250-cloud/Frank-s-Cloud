name: BTC ETF and COT Monitor

on:
  workflow_dispatch:
  schedule:
    # 1. 每个交易日美股盘后（北京时间 06:30-12:00 / UTC 22:30-04:00）每 30 分钟检测 ETF 资金流
    - cron: '30 22,23 * * 1-5'
    - cron: '0,30 0-4 * * 2-6'
    # 2. 每周六凌晨（北京时间 03:30-05:30 / UTC 周五 19:30-21:30）每 15 分钟检测 CFTC 周报
    - cron: '*/15 19-21 * * 5'
    # 3. 新增：美盘主力交易时段（北京时间 21:30 至次日 04:30 / UTC 13:30-20:30）每小时扫描 Coinbase 溢价
    - cron: '30 13-20 * * 1-5'

permissions:
  contents: write

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 cloudscraper

      - name: Run monitor script
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python etf_cot_monitor.py --force
          elif [ "${{ github.event.schedule }}" = "30 13-20 * * 1-5" ]; then
            python etf_cot_monitor.py --intraday
          else
            python etf_cot_monitor.py
          fi

      - name: Save deduplication state
        run: |
          git config --local user.email "bot@github.com"
          git config --local user.name "Monitor Bot"
          git add monitor_state.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update monitor state" && git push)
